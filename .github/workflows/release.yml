name: Release Chrome Extension

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.1.0 — leave empty to use package.json version)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Extension Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve release version & tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            INPUT_VER="${{ github.event.inputs.version }}"
            if [ -n "$INPUT_VER" ]; then
              VERSION="${INPUT_VER#v}"
            else
              VERSION=$(node -p "require('./package.json').version")
            fi
            TAG="v${VERSION}"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semver version: $VERSION (expected X.Y.Z)"
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved release ${TAG} (manifest version ${VERSION})"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: TypeScript typecheck
        run: npm run lint

      - name: Build & package extension ZIP
        run: |
          npm run build
          npx tsx scripts/package-extension.ts --version "${{ steps.meta.outputs.version }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Mengindex ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            release/mengindex-chrome-extension-v${{ steps.meta.outputs.version }}.zip
            release/mengindex-chrome-extension.zip
