name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Line Limit & Build Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: TypeScript typecheck
        run: npm run lint

      - name: Enforce max 300 lines per source file
        run: |
          OFFENDERS=$(find src extension scripts -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' \) -print0 \
            | xargs -0 wc -l \
            | awk '$2 != "total" && $1 > 300 { print $1, $2 }')
          if [ -n "$OFFENDERS" ]; then
            echo "Files exceeding 300-line standard:"
            echo "$OFFENDERS"
            exit 1
          fi
          echo "All source files are within the 300-line limit."

      - name: Build & verify Chrome Extension package
        run: npm run build:extension
